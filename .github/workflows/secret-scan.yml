name: Secret Scan - Gitleaks

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - main

  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Generate Secret Scan Summary
        if: always()
        run: |
          echo "# 🔐 Secret Scan - Gitleaks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.gitleaks.outcome }}" = "success" ]; then

            echo "## ✅ Nenhum segredo detectado" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "O Gitleaks não encontrou credenciais ou segredos expostos." \
              >> $GITHUB_STEP_SUMMARY

          else

            echo "## 🚨 Possível segredo detectado" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "O Gitleaks encontrou um ou mais possíveis segredos no repositório." \
              >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Abra o step **Run Gitleaks** para visualizar os detalhes." \
              >> $GITHUB_STEP_SUMMARY

          fi

      - name: Fail pipeline if secrets found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Secrets detected."
          exit 1
